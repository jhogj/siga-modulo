{%- import "_ui.html" as ui -%}
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Radar RJ · SIGA{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
{% block css %}{% endblock %}
<script src="/static/js/siga.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
<a class="pular" href="#conteudo">Ir para o conteúdo</a>
{% block faixa %}{{ ui.faixa("detalhe") }}{% endblock %}
<main id="conteudo">
{% block conteudo %}{% endblock %}
</main>
{{ ui.rodape() }}
</body>
</html>
